<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말하기 평가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF5FF;--ink:#1F2D4D;--sub:#5A6A8A;--card:#fff;--line:#D5E2F7;--blue:#3D6CF2;--rec:#E5484D;--sun:#FFC93C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 18px 60px}
h1,h2,.q{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400}
h1{font-size:30px;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 22px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,button,textarea{font:inherit;color:inherit}
select{border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff}
.q{font-size:26px;line-height:1.4;margin:10px 0 14px}
.ghost{background:none;border:2px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer}
.mic{display:block;margin:6px auto 10px;width:112px;height:112px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:44px;cursor:pointer;box-shadow:0 6px 0 #2A4FC0}
.mic:active{transform:translateY(3px);box-shadow:0 3px 0 #2A4FC0}
.mic.on{background:var(--rec);box-shadow:0 6px 0 #B3262B;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.state{text-align:center;color:var(--sub);min-height:1.6em}
textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:12px;padding:12px;resize:vertical}
.stats{color:var(--sub);font-size:14px;margin:8px 0 0}
.go{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-size:18px;cursor:pointer}
.go:disabled{opacity:.4;cursor:not-allowed}
table{width:100%;border-collapse:collapse;margin:8px 0}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.score{font-family:"Jua",sans-serif;font-size:20px;white-space:nowrap}
.total{font-family:"Jua",sans-serif;font-size:22px;margin-top:10px}
.praise{background:#FFF6D6;border-color:var(--sun)}
.tip{background:#E6F6EC;border-color:#9AD8B0}
h2{font-size:21px;margin:0 0 8px}
.hide{display:none}
.err{color:#B3262B;margin-top:10px}
.note{font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<main>
<h1>말하기 평가</h1>
<p class="lead">질문을 읽고, 마이크 버튼을 눌러 편하게 말해 보세요.</p>

<section class="card">
  <div class="row">
    <label>학년
      <select id="grade">
        </option><option selected>3~4학년</option><option>5~6학년</option>
      </select>
    </label>
    <button class="ghost" id="next" type="button">다른 질문 보기</button>
  </div>
  <p class="q" id="topic"></p>
  <button class="mic" id="mic" type="button" aria-label="녹음 시작">🎤</button>
  <div class="state" id="state" aria-live="polite">버튼을 누르면 녹음이 시작돼요</div>
</section>

<section class="card">
  <label for="text"><b>인식된 내용</b> <span class="note">(잘못 인식된 글자는 고칠 수 있어요)</span></label>
  <textarea id="text" placeholder="여기에 말한 내용이 나타나요"></textarea>
  <p class="stats" id="stats"></p>
  <button class="go" id="go" type="button" disabled>평가받기</button>
  <div class="err" id="err" role="alert"></div>
</section>

<div id="result" class="hide">
  <section class="card">
    <h2>평가 결과</h2>
    <table><thead><tr><th>영역</th><th>점수</th><th>핵심 요약</th></tr></thead><tbody id="rows"></tbody></table>
    <div class="total" id="total"></div>
  </section>
  <section class="card">
    <h2>영역별 자세한 분석</h2>
    <div id="details"></div>
  </section>
  <section class="card praise"><h2>칭찬 한마디</h2><div id="praise"></div></section>
  <section class="card tip"><h2>다음 도전</h2><div id="tip"></div></section>
</div>
<p class="note">음성 인식은 Chrome·Edge·Safari에서 가장 잘 동작해요. 음성 인식 과정에서 '어', '음' 같은 말은 빠질 수 있어요.</p>
</main>

<script>
const TOPICS=["What country would you like to visit? What would you like to see, eat, and do there?",
"If a student from another country visited your school, how would you welcome them? What would you do together?",
"What are three things you love about Korea? Why do you like them?",
"If you could travel around the world with your family, which countries would you visit and what would you do?",
"What Korean traditions would you like to introduce to a friend from another country? Why?",
"What country would you like to learn more about? What are you curious about?",
"If you could have a friend from any country, where would you want your friend to be from? What would you like to learn from them?",
"What are some differences between Korea and other countries you know? Which differences are interesting to you?",
"If you could introduce your hometown to a foreign friend, where would you take them and what would you show them?",
"What are the most important things in your school bag? How do you use them every day?",
"If you could design your dream bedroom, what things would you put in it and why?",
"What things do you need for your favorite hobby? How do you use them?",
"If you could invent three new things to make school life easier, what would they be and how would they work?",
"What are five things you would take on a camping trip? Why would you choose them?",
"What things in your classroom help you learn? Which ones do you use the most?",
"If you could make a special gift box for your best friend, what would you put inside and why?",
"What things would you need to plan a perfect birthday party? How would you use them?",
"If you could choose five things to take to a desert island, what would you take and how would they help you?",
"What rules do you think are important in your classroom? Why are they important?",
"If you could make three new rules for your school, what would they be and why?",
"What can students do to have fun during break time without disturbing others?",
"If you visited a museum with your friends, what would you want to see? What rules would you follow?",
"What should people do to keep parks clean and safe? What can you do to help?",
"If you could change the rules about using phones at school, what would you change and why?",
"What should students do when they want to borrow something from a friend? Why is asking permission important?",
"If you were in charge of a school library, what rules would you make and how would you help students enjoy reading?",
"What are some things you should and should not do when visiting someone else's home? Why?",
"What is your most precious thing? Who gave it to you, and why is it special?",
"If you lost your favorite thing, where would you look for it and who would you ask for help?",
"What would you do if you found a lost bag at school? How would you find its owner?",
"What things do you like sharing with your friends? What things do you prefer to keep for yourself?",
"Tell me about a special gift you received. Who gave it to you, and how did you feel?",
"If your friend accidentally broke something important to you, what would you say and do?",
"What are some things in your home that belong to different family members? How do you know whose things they are?",
"If you could give one of your favorite things to someone, what would you give and why?",
"Have you ever borrowed something from a friend or family member? What was it, and how did you take care of it?",
"If you had 50,000 won to spend on a shopping trip, what would you buy and why?",
"What is your favorite place to go shopping? What do you usually buy there, and who do you go with?",
"If you could open your own store, what would you sell? What would your store look like?",
"What would you buy for your family members if you went shopping for gifts? Why would you choose those things?",
"Do you prefer shopping online or visiting stores? What do you like and dislike about each one?",
"Tell me about something you really wanted to buy. Why did you want it, and did you get it?",
"If you went shopping with your best friend, where would you go and what would you buy together?",
"What do you think makes a good shopping experience? Tell me about a time you enjoyed shopping.",
"What are three things you want to do during your next summer vacation? Why do you want to do them?",
"If you could plan a summer trip with your family, where would you go and what would you do each day?",
"What would your perfect summer vacation day look like, from morning to night?",
"What new things would you like to learn or try this summer? Why are you interested in them?", "If you could spend a week at a summer camp, what activities would you like to do and who would you want to meet?",
"Would you rather spend your summer vacation at the beach, in the mountains, or in a big city? What would you do there?",
"If you could invite three friends to spend a summer day together, what activities would you plan?",
"What goals would you like to achieve during your next summer vacation? How will you achieve them?",
"What did you do during your last summer vacation? Where did you go, and what was your favorite memory?",
"Tell me about a festival you visited. What did you see, eat, and do there?",
"What was the most exciting day you had at school? What happened, and why was it special?",
"What did you do on your last birthday? Who did you celebrate with, and what did you enjoy the most?",
"Tell me about a fun weekend you remember. Where did you go, and what did you do?",
"What was your favorite family trip? What activities did you enjoy, and what made the trip special?",
"Tell me about a time you tried something new. What did you do, and how did you feel?",
"What was the funniest thing that happened to you recently? Who was there, and what happened?",
"What was your favorite school event last year? What did you do, and what would you like to do again?",
"If you could choose a special dinner for your birthday, what food and drinks would you like? Why?",
"If you opened your own restaurant, what food would you serve? What would make your restaurant special?",
"What would you like to order at your favorite restaurant? Who would you like to eat with, and why?",
"If a friend from another country visited Korea, what Korean foods would you recommend? How would you describe them?",
"What foods would you choose for a perfect picnic with your friends? What would you prepare?",
"If you could create a new school lunch menu, what foods would you include and why?",
"What would you like to cook for your family? What ingredients would you need, and how would you make it?",
"If you could try foods from three different countries, what would you choose and why?",
"If you received 30,000 won as a gift, how would you spend or save it? Explain your choices.",
"What are some things you want to buy that cost a lot of money? Why do you want them, and how could you save for them?",
"If you went to a store with 20,000 won, what snacks and school supplies would you buy? How would you decide?",
"Would you rather buy one expensive toy or several cheaper toys? What are the good things about your choice?",
"If you wanted to buy a birthday gift for your friend with 10,000 won, what would you choose and why?",
"What do you usually spend your pocket money on? What would you like to change about how you use it?",
"If you could save money for one year, what would you like to buy or do with it? Why?",
"If you were planning a class party with 100,000 won, what would you buy and how would you use the money?",
"What do you usually do from the time you wake up until you go to school? Describe your morning routine.",
"What is your favorite time of the day? What do you usually do then, and why do you like it?", "What do you usually do after school? Tell me about your afternoon and evening routine.",
"If you could make your own daily schedule, what time would you wake up, study, play, and go to bed?",
"How is your weekend schedule different from your school day schedule? Which do you like better?",
"What do you usually do before going to bed? What helps you sleep well?",
"If you had two extra hours of free time every day, how would you spend them and why?",
"What time do you usually do your homework, play games, and exercise? Would you like to change your routine?",
"What is your favorite school subject? What do you learn in that class, and why do you enjoy it?",
"If you could create a new school subject, what would it be? What activities would students do?",
"What is the most difficult subject for you? What makes it difficult, and how do you study it?",
"What activities do you enjoy most in English class? What new activities would you like to try?",
"If you were a teacher for one day, what subject would you teach and how would you make the lesson fun?",
"What is your favorite school project or assignment? What did you do, and what did you learn?",
"Do you prefer studying alone, with a friend, or in a group? What do you like about your choice?",
"If you could change your school timetable, which subjects would you add or have more often? Why?",
"What do you want to be when you grow up? What would you do in that job, and why do you want it?",
"If you could try three different jobs for one day, what would they be and what would you do?",
"What job would you like to have if you could help animals? What would you do every day?",
"Who is someone you admire because of their job? What do they do, and why do you admire them?",
"If you became a famous singer, athlete, or actor, what would your daily life look like?",
"What skills do you want to learn for your future dream job? How will you practice them?",
"If you could invent a completely new job, what would it be? How would it help other people?",
"Imagine your life when you are 30 years old. Where would you live, what job would you have, and what would you do in your free time?"];
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let ti=Math.floor(Math.random()*TOPICS.length), rec=null, on=false;
let startAt=0, firstAt=0, lastAt=0, pauses=[], finalText="";

const countWords=t=>t.trim()?t.trim().split(/\s+/).length:0;
function setTopic(){$("topic").textContent=TOPICS[ti]}
setTopic();
$("next").onclick=()=>{if(on)return;ti=(ti+1)%TOPICS.length;setTopic()};

function refresh(){
  const t=$("text").value;
  $("go").disabled=!t.trim();
  const dur=firstAt?(lastAt-firstAt)/1000:0;
  $("stats").textContent=t.trim()?`어절 ${countWords(t)}개`+(dur>0?` · 말한 시간 ${dur.toFixed(1)}초`:""):"";
}
$("text").addEventListener("input",refresh);

if(!SR){$("state").textContent="이 브라우저는 음성 인식을 지원하지 않아요. 아래 칸에 직접 입력해 주세요.";$("mic").disabled=true}

function start(){
  rec=new SR();rec.lang="ko-KR";rec.continuous=true;rec.interimResults=true;
  finalText="";pauses=[];firstAt=0;lastAt=0;startAt=Date.now();
  $("text").value="";$("result").classList.add("hide");$("err").textContent="";
  rec.onresult=e=>{
    const now=Date.now();
    if(!firstAt)firstAt=now; else if(now-lastAt>2000)pauses.push((now-lastAt)/1000);
    lastAt=now;
    let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal)finalText+=r[0].transcript+" "; else interim+=r[0].transcript;
    }
    $("text").value=(finalText+interim).trim();refresh();
  };
  rec.onerror=e=>{
    const m={"not-allowed":"마이크 사용을 허용해 주세요.","no-speech":"목소리가 들리지 않았어요. 다시 해 볼까요?","audio-capture":"마이크를 찾을 수 없어요."};
    $("state").textContent=m[e.error]||"음성 인식에 문제가 생겼어요.";
  };
  rec.onend=()=>{ if(on)stop(true) };
  rec.start();on=true;
  $("mic").classList.add("on");$("mic").textContent="⏹";$("mic").setAttribute("aria-label","녹음 끝내기");
  $("state").textContent="듣고 있어요… 다 말했으면 한 번 더 눌러요";
}
function stop(ended){
  if(!ended&&rec)rec.stop();
  on=false;
  $("mic").classList.remove("on");$("mic").textContent="🎤";$("mic").setAttribute("aria-label","녹음 시작");
  $("state").textContent="녹음이 끝났어요. 내용을 확인하고 평가받기를 눌러요";
  refresh();
}
$("mic").onclick=()=>on?stop(false):start();

const AREAS=[["fluency","유창성"],["accuracy","정확성"],["engagement","적극성"]];
function add(parent,tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;parent.appendChild(n);return n}

$("go").onclick=()=>{
  $("err").textContent="";
  const text=$("text").value.trim();
  if(!text){
    $("err").textContent="먼저 내용을 입력해 주세요.";
    return;
  }
  $("go").disabled=true;$("go").textContent="평가하는 중…";

  const words=countWords(text);
  const hasReason=/(왜냐하면|이유는|때문에|그래서|좋아서|싫어서|하고 싶어서)/.test(text);
  const hasExample=/(예를 들면|예를 들어|예시|그리고|또한|특히)/.test(text);
  const hasEnding=/[.!?。]|요(?:\s|$)|니다(?:\s|$)|다(?:\s|$)/.test(text);

  const score=n=>Math.max(1,Math.min(5,n));

  let fluencyScore=words<=3?1:words<=7?2:words<=14?3:words<=24?4:5;
  if(firstAt && pauses.length>=4) fluencyScore--;

  let accuracyScore=1;
  if(words>=6) accuracyScore++;
  if(hasEnding) accuracyScore++;
  if(hasReason) accuracyScore++;
  if(hasExample) accuracyScore++;

  let engagementScore=1;
  if(words>=8) engagementScore++;
  if(words>=16) engagementScore++;
  if(hasReason) engagementScore++;
  if(hasExample) engagementScore++;

  const d={
    fluency:{
      score:score(fluencyScore),
      summary:words>=15?"여러 어절로 생각을 표현했어요.":"조금 더 길게 이어서 말해 보면 좋아요.",
      analysis:`인식된 답변은 ${words}어절이에요. 이유나 예를 덧붙여 문장을 이어 말해 보세요.`
    },
    accuracy:{
      score:score(accuracyScore),
      summary:hasReason?"생각이나 이유를 함께 표현했어요.":"생각한 이유를 덧붙이면 더 분명해져요.",
      analysis:hasReason
        ?"이유를 나타내는 표현이 포함되어 있어요. 실제 맞춤법이나 문법 검사가 아닌 답변 구성에 대한 참고 점수예요."
        :"왜 그렇게 생각하는지 이유를 한 문장 더 덧붙여 보세요. 실제 맞춤법이나 문법 검사가 아닌 참고 점수예요."
    },
    engagement:{
      score:score(engagementScore),
      summary:hasExample?"예를 들어 자세히 설명했어요.":words>=12?"생각을 비교적 자세히 표현했어요.":"구체적인 이야기를 더해 보면 좋아요.",
      analysis:hasExample
        ?"예시나 덧붙이는 표현이 있어 답변을 자세히 전달했어요."
        :"경험이나 예시를 하나 덧붙이면 답변이 더 생생해질 수 있어요."
    },
    praise:`${$("grade").value} 학생답게 생각을 표현하려고 노력했어요. 잘했어요!`,
    nextStep:"다음에는 왜 그렇게 생각하는지 이유와 구체적인 예를 하나씩 덧붙여 보세요."
  };

  render(d);
  $("go").textContent="평가받기";refresh();
};

function render(d){
  const rows=$("rows"),det=$("details");rows.innerHTML="";det.innerHTML="";
  let sum=0;
  for(const [k,label] of AREAS){
    const a=d[k];sum+=a.score;
    const tr=document.createElement("tr");
    add(tr,"td",label);add(tr,"td",`${a.score} / 5`,"score");add(tr,"td",a.summary);
    rows.appendChild(tr);
    const p=add(det,"p","");add(p,"b",label+" 분석: ");p.appendChild(document.createTextNode(a.analysis));
  }
  $("total").textContent=`총점: ${sum} / 15점`;
  $("praise").textContent=d.praise;$("tip").textContent=d.nextStep;
  $("result").classList.remove("hide");
  $("result").scrollIntoView({behavior:"smooth"});
}
refresh();
</script>
<!-- ===== 학습 성찰 + 구글 시트 저장 (여기부터 복사) ===== -->
<section id="rf-reflection" class="rf-card" aria-label="학습 성찰">
  <h2 class="rf-title">오늘의 학습 성찰</h2>

  <label class="rf-student">
    <span>번호 또는 이름</span>
    <input type="text" id="rf-student" maxlength="30" placeholder="예: 6-2 15번" autocomplete="off">
  </label>

  <div id="rf-list"></div>

  <div class="rf-footer">
    <span id="rf-progress" class="rf-progress">응답 완료 0/3</span>
    <div class="rf-buttons">
      <button type="button" id="rf-reset" class="rf-reset">초기화</button>
      <button type="button" id="rf-submit" class="rf-submit">제출하기</button>
    </div>
  </div>
  <p id="rf-msg" class="rf-msg" role="status" aria-live="polite"></p>
</section>

<style>
  .rf-card {
    max-width: 960px; margin: 32px auto; padding: 28px 24px 20px;
    border: 1px solid #e5e5e5; border-radius: 20px; background: #fdfdfd;
    font-family: inherit; box-sizing: border-box;
  }
  .rf-title { font-size: 1.25rem; margin: 0 0 16px; }
  .rf-student { display: flex; align-items: center; gap: 12px; font-size: 1.05rem; flex-wrap: wrap; }
  .rf-student input {
    flex: 1; min-width: 160px; max-width: 280px; padding: 10px 14px; font: inherit;
    border: 1px solid #ccc; border-radius: 10px;
  }
  .rf-q { padding: 18px 0; border-bottom: 1px solid #eee; }
  .rf-q-text { font-size: 1.15rem; font-weight: 500; margin: 0 0 14px; }
  .rf-options { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .rf-opt {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 14px 4px; border: 1px solid #e3e3e3; border-radius: 12px;
    background: #f3f3f3; cursor: pointer; font: inherit; color: #555;
    transition: background .15s, border-color .15s, color .15s;
  }
  .rf-opt:hover { background: #eaeaea; }
  .rf-opt .rf-num { font-size: 1.5rem; }
  .rf-opt .rf-label { font-size: .85rem; }
  .rf-opt[aria-pressed="true"] { background: #2f6fed; border-color: #2f6fed; color: #fff; font-weight: 600; }
  .rf-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; gap: 12px; flex-wrap: wrap; }
  .rf-progress { color: #666; font-size: 1.05rem; }
  .rf-buttons { display: flex; gap: 8px; }
  .rf-reset, .rf-submit {
    padding: 8px 22px; border-radius: 999px; cursor: pointer; font: inherit;
  }
  .rf-reset { border: 1px solid #ccc; background: #fff; }
  .rf-reset:hover { background: #f3f3f3; }
  .rf-submit { border: 1px solid #2f6fed; background: #2f6fed; color: #fff; font-weight: 600; }
  .rf-submit:disabled { opacity: .5; cursor: default; }
  .rf-msg { margin: 14px 0 0; text-align: center; font-weight: 600; min-height: 1.4em; }
  .rf-msg.ok { color: #2f6fed; }
  .rf-msg.warn { color: #c0392b; }
  @media (max-width: 520px) {
    .rf-options { gap: 6px; }
    .rf-opt { padding: 10px 2px; }
    .rf-opt .rf-label { font-size: .7rem; }
  }
</style>

<script>
(function () {
  // ▼ 선생님: 구글 Apps Script '웹 앱 URL'을 따옴표 안에 붙여넣으세요.
  var SHEET_URL = "https://script.google.com/macros/s/AKfycbxPojcf7Flx6nFrfIzSaoxA_VWZ10PV5NkCJk2NtITXft6I5xnjvRFkk1NACa2glIliCA/exec";

  // ▼ 성찰 질문은 여기서 바꾸면 됩니다.
  var RF_QUESTIONS = [
    "나는 오늘 영어로 말하기 위해 적극적으로 노력했나요?",
    "나는 영어로 말할 때 실수를 두려워하지 않고 자신 있게 말했나요?",
    "나는 오늘 연습을 통해 이전보다 영어로 말하는 능력이 나아졌다고 느꼈나요?"
  ];
  var RF_LABELS = ["전혀 아니에요", "아니에요", "보통이에요", "그래요", "매우 그래요"];

  var answers = new Array(RF_QUESTIONS.length).fill(null);
  var section = document.getElementById("rf-reflection");
  var list = document.getElementById("rf-list");
  var progress = document.getElementById("rf-progress");
  var msg = document.getElementById("rf-msg");
  var studentInput = document.getElementById("rf-student");
  var submitBtn = document.getElementById("rf-submit");
  var confirmNoScore = false;

  RF_QUESTIONS.forEach(function (q, qi) {
    var wrap = document.createElement("div");
    wrap.className = "rf-q";
    var p = document.createElement("p");
    p.className = "rf-q-text";
    p.textContent = (qi + 1) + ". " + q;
    wrap.appendChild(p);
    var opts = document.createElement("div");
    opts.className = "rf-options";
    opts.setAttribute("role", "group");
    opts.setAttribute("aria-label", (qi + 1) + "번 질문 응답");
    RF_LABELS.forEach(function (label, li) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "rf-opt";
      b.setAttribute("aria-pressed", "false");
      b.innerHTML = '<span class="rf-num">' + (li + 1) + '</span><span class="rf-label">' + label + "</span>";
      b.addEventListener("click", function () {
        answers[qi] = li + 1;
        opts.querySelectorAll(".rf-opt").forEach(function (o) { o.setAttribute("aria-pressed", "false"); });
        b.setAttribute("aria-pressed", "true");
        update();
      });
      opts.appendChild(b);
    });
    wrap.appendChild(opts);
    list.appendChild(wrap);
  });

  function update() {
    var n = answers.filter(function (a) { return a !== null; }).length;
    progress.textContent = "응답 완료 " + n + "/" + RF_QUESTIONS.length;
  }

  function show(text, kind) {
    msg.textContent = text;
    msg.className = "rf-msg " + (kind || "");
  }

  function resetAll() {
    answers.fill(null);
    list.querySelectorAll(".rf-opt").forEach(function (o) { o.setAttribute("aria-pressed", "false"); });
    submitBtn.disabled = false;
    confirmNoScore = false;
    show("");
    update();
  }
  document.getElementById("rf-reset").addEventListener("click", resetAll);

  // ---- 평가 화면에서 결과를 읽어 오기 (성찰 칸은 제외) ----
  function pageText() {
    // 화면에 보이는 글자 (표의 한 줄 = 한 줄). 성찰 칸 글자는 빼고 읽음
    var all = document.body.innerText || "";
    var mine = section.innerText || "";
    return mine ? all.replace(mine, "") : all;
  }

  function findScore(text, name) {
    var m = text.match(new RegExp(name + "[^\\n]*?(\\d(?:\\.\\d)?)\\s*/\\s*5(?!\\d)"));
    return m ? m[1] : "";
  }

  function collect() {
    var text = pageText();
    var data = {
      fluency: findScore(text, "유창성"),
      accuracy: findScore(text, "정확성"),
      engagement: findScore(text, "적극성"),
      total: "", text: "", grade: "", topic: "", duration: "", words: ""
    };
    var t = text.match(/총점[^\d]*(\d{1,2}(?:\.\d)?)\s*\/\s*15/);
    if (t) data.total = t[1];
    else if (data.fluency && data.accuracy && data.engagement) {
      data.total = String(Number(data.fluency) + Number(data.accuracy) + Number(data.engagement));
    }

    // 발화 텍스트: 성찰 칸 밖에서 가장 긴 입력 칸
    var best = "";
    document.querySelectorAll("textarea, input[type=text]").forEach(function (el) {
      if (section.contains(el)) return;
      if ((el.value || "").length > best.length) best = el.value;
    });
    data.text = best.trim();

    // 학년: '학년'이 들어간 선택 칸
    document.querySelectorAll("select").forEach(function (sel) {
      if (section.contains(sel) || data.grade) return;
      var opt = sel.options[sel.selectedIndex];
      if (opt && /학년/.test(opt.text)) data.grade = opt.text.trim();
    });
    if (!data.grade) {
      var g = document.querySelector('[aria-pressed="true"], .active, .selected');
      if (g && !section.contains(g) && /학년/.test(g.textContent)) data.grade = g.textContent.trim();
    }

    // 질문: id나 class에 topic / question 이 들어간 요소
    var tEl = Array.prototype.find.call(
      document.querySelectorAll('[id*="topic" i], [class*="topic" i], [id*="question" i], [class*="question" i]'),
      function (el) { return !section.contains(el) && el.tagName !== "SELECT" && el.textContent.trim(); }
    );
    if (tEl) data.topic = tEl.textContent.trim().replace(/\s+/g, " ").slice(0, 200);

    var d = text.match(/(?:발화|말한)\s*시간[^\d\n]*(\d+(?:\.\d+)?)/);
    if (d) data.duration = d[1];
    var w = text.match(/(\d+)\s*어절/) || text.match(/어절[^\d\n]*(\d+)/);
    if (w) data.words = w[1];
    return data;
  }

  submitBtn.addEventListener("click", function () {
    var student = studentInput.value.trim();
    if (!student) { show("번호 또는 이름을 적어 주세요.", "warn"); studentInput.focus(); return; }
    if (answers.some(function (a) { return a === null; })) {
      show("성찰 질문 3개에 모두 답해 주세요.", "warn"); return;
    }
    if (SHEET_URL.indexOf("https://script.google.com/") !== 0) {
      show("선생님: 코드의 SHEET_URL에 웹 앱 주소를 넣어 주세요.", "warn"); return;
    }

    var data = collect();
    if (!data.fluency && !confirmNoScore) {
      confirmNoScore = true;
      show("아직 평가 점수가 보이지 않아요. 말하기 평가를 먼저 했나요? 그래도 제출하려면 한 번 더 누르세요.", "warn");
      return;
    }

    data.student = student;
    data.reflection = answers.slice();
    submitBtn.disabled = true;
    show("제출하는 중이에요…");

    fetch(SHEET_URL, {
      method: "POST",
      mode: "no-cors", // 구글 스크립트로 보낼 때 필요한 설정
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(data)
    }).then(function () {
      show("제출했어요! 오늘도 수고했어요 🌟", "ok");
    }).catch(function () {
      submitBtn.disabled = false;
      show("제출하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.", "warn");
    });
  });

  update();
})();
</script>
<!-- ===== 학습 성찰 + 구글 시트 저장 (여기까지 복사) ===== -->
